<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Score Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: 
            linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)),
    url('grass.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .team-select {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .team-column {
            flex: 1;
            min-width: 200px;
        }
        .team-column h3 {
            margin-top: 0;
            color: #333;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input, select {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
        }
        .game-log {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 20px;
            background-color: white;
            border-radius: 4px;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background-color: #f2f2f2;
            padding: 15px;
            border-radius: 8px;
            position: relative;
        }
        .team-score {
            text-align: center;
        }
        .team-name {
            font-size: 1.5em;
            font-weight: bold;
        }
        .score {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        .aggregate-display {
            font-size: 0.8em;
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            color: #666;
        }
        .game-time {
            text-align: center;
            font-size: 1.2em;
            margin: 10px 0;
            width: 100px; /* Fixed width for better alignment */
        }
        .match-status {
            text-align: center;
            font-size: 1.2em;
            margin: 10px 0;
            width: 100px; /* Matches game-time width */
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
        .penalty-shootout {
            margin-top: 20px;
        }
        .stats-container {
            margin-top: 20px;
        }
        .simulation-mode {
            margin: 15px 0;
        }
        .mode-option {
            margin: 5px 0;
        }
        .scoreboard-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .settings-container {
        margin-bottom: 15px;
        }
        
        .settings-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .simulation-mode {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .simulation-mode h4 {
            margin: 0;
            white-space: nowrap;
        }
        
        .radio-options {
            display: flex;
            gap: 15px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .score-inputs {
            display: flex;
            gap: 10px;
        }
        
        .score-inputs input {
            width: 100px;
        }
    </style>
</head>

        // Initialize the game
        function initGame() {
            // Get team names
            const presetTeam1 = document.getElementById('preset-team1').value;
            const customTeam1 = document.getElementById('custom-team1').value;
            gameState.team1.name = customTeam1 || presetTeam1;
            
            const presetTeam2 = document.getElementById('preset-team2').value;
            const customTeam2 = document.getElementById('custom-team2').value;
            gameState.team2.name = customTeam2 || presetTeam2;
            
            // Handle same team names
            if (gameState.team1.name === gameState.team2.name) {
                gameState.team2.name += " 2";
            }
            
            // Get players for each team
            gameState.team1.players = teamPlayers[gameState.team1.name] || Array(10).fill().map((_, i) => `${gameState.team1.name} Player ${i+1}`);
            gameState.team2.players = teamPlayers[gameState.team2.name] || Array(10).fill().map((_, i) => `${gameState.team2.name} Player ${i+1}`);
            
            // Get game settings
            gameState.strength = parseInt(document.getElementById('strength').value);
            gameState.isLive = document.querySelector('input[name="sim-mode"]:checked').value === 'live';
            gameState.isImmediate = !gameState.isLive;
            gameState.isTwoLegs = document.getElementById('two-legs').checked;
            gameState.isLeg2 = false;
            gameState.matchEnded = false;
            
            if (gameState.isTwoLegs) {
                gameState.leg1Score.team1 = parseInt(document.getElementById('leg1-team1').value) || 0;
                gameState.leg1Score.team2 = parseInt(document.getElementById('leg1-team2').value) || 0;
            }
            
            // Calculate extra time
            calculateExtraTime();
            
            // Reset game state
            gameState.time = 0;
            gameState.team1.score = 0;
            gameState.team2.score = 0;
            gameState.events = [];
            gameState.isExtraTime = false;
            gameState.isPenalties = false;
            gameState.penalties = { team1: 0, team2: 0, shots: [] };
            
            // Reset stats
            gameState.stats = {
                shots: { team1: 0, team2: 0 },
                shotsOnTarget: { team1: 0, team2: 0 },
                possession: { 
                    team1: Math.floor(Math.random() * 41) + 30, // Random between 30-70
                    get team2() {
                        return 100 - this.team1;
                    }
                 }
            };
            
            // Update UI
            updateUI();
            
            // Add initial event
            if (gameState.isLeg2) {
                addLogEntry("Leg 2 started!");
            } else {
                addLogEntry("Match started!");
            }
            
            if (gameState.isTwoLegs && gameState.leg1Score.team1 + gameState.leg1Score.team2 > 0) {
                addLogEntry(`Leg 1: ${gameState.team1.name} ${gameState.leg1Score.team1}-${gameState.leg1Score.team2} ${gameState.team2.name}`);
                updateAggregateDisplay();
            }
            
            // Start simulation based on mode
            if (gameState.isImmediate) {
                simulateFullMatch();
            } else {
                simulateLive();
            }
        }

        function updateAggregateDisplay() {
            if (gameState.isTwoLegs) {
                const aggTeam1 = gameState.team1.score + gameState.leg1Score.team1;
                const aggTeam2 = gameState.team2.score + gameState.leg1Score.team2;
                elements.aggregateDisplay.textContent = `Aggregate: ${gameState.team1.name} ${aggTeam1}-${aggTeam2} ${gameState.team2.name}`;
            } else {
                elements.aggregateDisplay.textContent = '';
            }
        }

        function updateMatchStatus() {
            if (gameState.matchEnded) {
                if (gameState.time >= 120) {
                    elements.matchStatus.textContent = "AET";
                } else {
                    elements.matchStatus.textContent = "FT";
                }
                elements.gameTime.classList.add('hidden');
                elements.matchStatus.classList.remove('hidden');
            } else {
                elements.gameTime.classList.remove('hidden');
                elements.matchStatus.classList.add('hidden');
            }
        }

        function calculateExtraTime() {
            // First half added time (45+)
            gameState.extraTime.firstHalf = 45 + (Math.random() < 0.8 ? 
                Math.floor(Math.random() * 7) + 1 : 
                Math.floor(Math.random() * 8) + 5);
            
            // Second half added time (90+)
            gameState.extraTime.secondHalf = 90 + (Math.random() < 0.5 ? 
                Math.floor(Math.random() * 6) + 1 : 
                Math.random() < 0.7 ? 
                    Math.floor(Math.random() * 5) + 5 : 
                    Math.random() < 0.9 ? 
                        Math.floor(Math.random() * 4) + 7 : 
                        Math.floor(Math.random() * 6) + 9);
            
            // First extra time half added time (105+)
            gameState.extraTime.firstExtra = 105 + (Math.random() < 0.8 ? 
                Math.floor(Math.random() * 3) + 1 : 
                Math.floor(Math.random() * 3) + 3);
            
            // Second extra time half added time (120+)
            gameState.extraTime.secondExtra = 120 + (Math.random() < 0.5 ? 
                Math.floor(Math.random() * 2) + 1 : 
                Math.random() < 0.86 ? 
                    Math.floor(Math.random() * 3) + 2 : 
                    Math.floor(Math.random() * 3) + 4);
        }

        function updateUI() {
            elements.team1Name.textContent = gameState.team1.name;
            elements.team2Name.textContent = gameState.team2.name;
            elements.team1Score.textContent = gameState.team1.score;
            elements.team2Score.textContent = gameState.team2.score;
            elements.eventsTeam1.textContent = gameState.team1.name;
            elements.eventsTeam2.textContent = gameState.team2.name;
            elements.penaltyTeam1.textContent = gameState.team1.name;
            elements.penaltyTeam2.textContent = gameState.team2.name;
            elements.statsTeam1.textContent = gameState.team1.name;
            elements.statsTeam2.textContent = gameState.team2.name;
            elements.gameTime.textContent = "0'";
            elements.gameLog.innerHTML = "";
            elements.eventsBody.innerHTML = "";
            elements.penaltyBody.innerHTML = "";
            elements.statsBody.innerHTML = "";
            
            updateAggregateDisplay();
            updateMatchStatus();
            
            elements.penaltyShootout.classList.add('hidden');
            elements.statsContainer.classList.add('hidden');
            elements.leg2Button.classList.add('hidden');
            elements.extraTimeButton.classList.add('hidden');
            
            // Show game screen
            elements.setupScreen.classList.add('hidden');
            elements.gameScreen.classList.remove('hidden');
            
            // Initialize team club based on strength
            gameState.teamClub = [];
            switch(gameState.strength) {
                case 1:
                    gameState.teamClub.push(...Array(5).fill(gameState.team1.name));
                    gameState.teamClub.push(...Array(1).fill(gameState.team2.name));
                    break;
                case 2:
                    gameState.teamClub.push(...Array(5).fill(gameState.team1.name));
                    gameState.teamClub.push(...Array(2).fill(gameState.team2.name));
                    break;
                case 3:
                    gameState.teamClub.push(...Array(4).fill(gameState.team1.name));
                    gameState.teamClub.push(...Array(3).fill(gameState.team2.name));
                    break;
                case 4:
                    gameState.teamClub.push(gameState.team1.name);
                    gameState.teamClub.push(gameState.team2.name);
                    break;
                case 5:
                    gameState.teamClub.push(...Array(3).fill(gameState.team1.name));
                    gameState.teamClub.push(...Array(4).fill(gameState.team2.name));
                    break;
                case 6:
                    gameState.teamClub.push(...Array(2).fill(gameState.team1.name));
                    gameState.teamClub.push(...Array(5).fill(gameState.team2.name));
                    break;
                case 7:
                    gameState.teamClub.push(...Array(1).fill(gameState.team1.name));
                    gameState.teamClub.push(...Array(5).fill(gameState.team2.name));
                    break;
            }
        }

        // Simulate the full match immediately
        function simulateFullMatch() {
            gameState.isSimulating = true;
            
            // Simulate first half
            while (gameState.time < 45) {
                simulateMinute();
            }
            
            // first half stoppage time
            while (gameState.time < gameState.extraTime.firstHalf) {
                simulateMinute();
            }
            
            // Half-time
            addLogEntry("Half time");
            gameState.time = 45;
            gameState.extraTime.firstHalf = 0;
            
            // Simulate second half
            while (gameState.time < 90) {
                simulateMinute();
            }
            
            // second half stoppage time
            while (gameState.time < gameState.extraTime.secondHalf) {
                simulateMinute();
            }
            
            // Full-time
            addLogEntry("Full time");
            gameState.matchEnded = true;
            updateMatchStatus();
            
            // Check match end
            checkMatchEnd();
            
            gameState.isSimulating = false;
        }

        // Simulate match live
        function simulateLive() {
            clearExistingIntervals();

            gameState.isSimulating = true;
            gameState.simulationInterval = setInterval(() => {
                simulateMinute();
                
                // Check if we've reached the end of first half (45 minutes)
                if (gameState.time === 45) {
                    // First half ended, add stoppage time
                    clearInterval(gameState.simulationInterval);
                    gameState.simulationInterval = setInterval(() => {
                        simulateMinute();
                        if (gameState.time >= gameState.extraTime.firstHalf) {
                            clearInterval(gameState.simulationInterval);
                            addLogEntry("Half time");
                            
                            // Reset time to 45 for the second half
                            gameState.time = 45;
                            gameState.extraTime.firstHalf = 0;

                            setTimeout(() => {
                                gameState.simulationInterval = setInterval(() => {
                                    simulateMinute();
                                    if (gameState.time >= 90) {
                                        clearInterval(gameState.simulationInterval);
                                        // Second half ended, add stoppage time
                                        gameState.simulationInterval = setInterval(() => {
                                            simulateMinute();
                                            if (gameState.time >= gameState.extraTime.secondHalf) {
                                                clearInterval(gameState.simulationInterval);
                                                addLogEntry("Full time");
                                                
                                                
                                                gameState.matchEnded = true;
                                                updateMatchStatus();
                                                checkMatchEnd();
                                            }
                                        }, 750);
                                    }
                                }, 750);
                            }, 1500);
                        }
                    }, 750);
                }
            }, 750);
        }

        // Simulate one minute of game time
        function simulateMinute() {
            gameState.time += 1;
    
            // Update game time display
            let displayTime;
            let timeString;
            
            if (gameState.time <= 45) {
                // First half
                displayTime = gameState.time;
                timeString = `${displayTime}'`;
            } else if (gameState.time <= gameState.extraTime.firstHalf) {
                // First half stoppage time
                displayTime = gameState.time - 45;
                timeString = `45+${displayTime}'`;
            } else if (gameState.time <= 90) {
                // Second half (resets to 45 after first half stoppage)
                displayTime = gameState.time - 45;
                timeString = `${45 + displayTime}'`;
            } else if (gameState.time <= gameState.extraTime.secondHalf) {
                // Second half stoppage time
                displayTime = gameState.time - 90;
                timeString = `90+${displayTime}'`;
            } else if (gameState.isExtraTime && gameState.time <= 105) {
                // First half of extra time
                displayTime = gameState.time;
                timeString = `${displayTime}'`;
            } else if (gameState.isExtraTime && gameState.time <= gameState.extraTime.firstExtra) {
                // First half extra time stoppage
                displayTime = gameState.time - 105;
                timeString = `105+${displayTime}'`;
            } else if (gameState.isExtraTime && gameState.time <= 120) {
                // Second half of extra time
                displayTime = gameState.time - 105;
                timeString = `${105 + displayTime}'`;
            } else if (gameState.isExtraTime) {
                // Second half extra time stoppage
                displayTime = gameState.time - 120;
                timeString = `120+${displayTime}'`;
            }
            
            elements.gameTime.textContent = timeString;

            // Only track shots if not in penalty shootout
            if (!gameState.isPenalties) {
                // Random shots during normal time (base probability)
                if (!gameState.isExtraTime) {
                    // Home team random shot chance (10% per minute)
                    if (Math.random() < 0.10) {
                        gameState.stats.shots.team1++;
                        // 50% chance shot is on target
                        if (Math.random() < 0.5) {
                            gameState.stats.shotsOnTarget.team1++;
                        }
                    }
                    
                    // Away team random shot chance (10% per minute)
                    if (Math.random() < 0.10) {
                        gameState.stats.shots.team2++;
                        // 50% chance shot is on target
                        if (Math.random() < 0.5) {
                            gameState.stats.shotsOnTarget.team2++;
                        }
                    }
                }
                
                // Additional random shots during extra time
                if (gameState.isExtraTime) {
                    // Home team extra time shot chance (15% per minute)
                    if (Math.random() < 0.15) {
                        gameState.stats.shots.team1++;
                        // 50% chance shot is on target
                        if (Math.random() < 0.5) {
                            gameState.stats.shotsOnTarget.team1++;
                        }
                    }
                    
                    // Away team extra time shot chance (15% per minute)
                    if (Math.random() < 0.15) {
                        gameState.stats.shots.team2++;
                        // 50% chance shot is on target
                        if (Math.random() < 0.5) {
                            gameState.stats.shotsOnTarget.team2++;
                        }
                    }
                }
            }

            // Original goal scoring logic (unchanged)
            let rand1, rand2, og1, og2, pen1, pen2;
            
            if (gameState.strength === 1 || gameState.strength === 7) {
                rand1 = Math.floor(Math.random() * 16);
                rand2 = Math.floor(Math.random() * 16);
                og1 = Math.floor(Math.random() * 21);
                og2 = Math.floor(Math.random() * 31) + 15;
            } else {
                rand1 = Math.floor(Math.random() * 26);
                rand2 = Math.floor(Math.random() * 26);
                og1 = Math.floor(Math.random() * 21);
                og2 = Math.floor(Math.random() * 31) + 10;
            }
            
            pen1 = Math.floor(Math.random() * 6) + 5;
            pen2 = Math.floor(Math.random() * 6) + 5;
            
            const penalty = pen1 === pen2 ? " (P)" : "";
            
            if (rand1 === rand2) {
                const randClub = gameState.teamClub[Math.floor(Math.random() * gameState.teamClub.length)];
                
                if (og1 !== og2) {
                    // Normal goal
                    if (randClub === gameState.team1.name) {
                        gameState.stats.shots.team1++;
                        gameState.stats.shotsOnTarget.team1++;

                        gameState.team1.score += 1;

                        const randScorer = gameState.team1.players[Math.floor(Math.random() * gameState.team1.players.length)];
                        addEvent(timeString, `${randScorer}${penalty}`, "");
                        addLogEntry(`${gameState.team1.name} scores! ${randScorer}${penalty}`);

                    } else if (randClub === gameState.team2.name) {
                        gameState.stats.shots.team2++;
                        gameState.stats.shotsOnTarget.team2++;

                        gameState.team2.score += 1;
                        
                        const randScorer = gameState.team2.players[Math.floor(Math.random() * gameState.team2.players.length)];
                        addEvent(timeString, "", `${randScorer}${penalty}`);
                        addLogEntry(`${gameState.team2.name} scores! ${randScorer}${penalty}`);
                    }
                } else {
                    // Own goal
                    if (randClub === gameState.team1.name) {
                        gameState.team1.score += 1;
                        
                        const randScorer = gameState.team2.players[Math.floor(Math.random() * gameState.team2.players.length)];
                        addEvent(timeString, `${randScorer} (OG)`, "");
                        addLogEntry(`Own goal for ${gameState.team1.name}! ${randScorer} (OG)`);
                    } else if (randClub === gameState.team2.name) {
                        gameState.team2.score += 1;
                        const randScorer = gameState.team1.players[Math.floor(Math.random() * gameState.team1.players.length)];
                        addEvent(timeString, "", `${randScorer} (OG)`);
                        addLogEntry(`Own goal for ${gameState.team2.name}! ${randScorer} (OG)`);
                    }
                }
                
                // Update score display
                elements.team1Score.textContent = gameState.team1.score;
                elements.team2Score.textContent = gameState.team2.score;
                
                if (gameState.isTwoLegs) {
                    updateAggregateDisplay();
                }
            }
        }

        // Check if match should end
        function checkMatchEnd() {
            gameState.isSimulating = false;
            
            if (gameState.isExtraTime) {
                // In extra time, check aggregate score if it's a two-leg tie
                if (gameState.isTwoLegs) {
                    const aggTeam1 = gameState.team1.score + gameState.leg1Score.team1;
                    const aggTeam2 = gameState.team2.score + gameState.leg1Score.team2;

                    if (aggTeam1 !== aggTeam2) {
                        endMatch();
                    } else {
                        startPenaltyShootout(); // This was missing in the original code
                    }
                } 
                // For single matches, check current score
                else if (gameState.team1.score !== gameState.team2.score) {
                    endMatch();
                } else {
                    startPenaltyShootout();
                }
            } else {
                // Normal time
                if (gameState.isTwoLegs) {
                    const aggTeam1 = gameState.team1.score + gameState.leg1Score.team1;
                    const aggTeam2 = gameState.team2.score + gameState.leg1Score.team2;
                    
                    if (aggTeam1 !== aggTeam2) {
                        endMatch();
                    } else {
                        showPostMatchOptions();
                    }
                } else {
                    if (gameState.team1.score !== gameState.team2.score) {
                        endMatch();
                    } else {
                        showPostMatchOptions();
                    }
                }
            }
        }

function startPenaltyShootout() {

    addLogEntry("Penalty shootout started!");

function showPostMatchOptions() {

        function showPostMatchOptions() {

        // Start extra time
        function startExtraTime() {
            gameState.extraTime.secondHalf = 0;
            gameState.time = 90;
            gameState.isExtraTime = true;
            gameState.matchEnded = false;
            elements.extraTimeButton.classList.add('hidden');

            elements.gameTime.classList.remove('hidden');
            elements.matchStatus.classList.add('hidden');
            
            if (gameState.isImmediate) {
                // Simulate first half of extra time
                while (gameState.time < 105) {
                    simulateMinute();
                }
                
                // Add first half stoppage time
                while (gameState.time < gameState.extraTime.firstExtra) {
                    simulateMinute();
                }
                
                addLogEntry("Extra time half time");
                gameState.time = 105;
                gameState.extraTime.firstExtra = 0;
                
                // Simulate second half of extra time
                while (gameState.time < 120) {
                    simulateMinute();
                }
                
                // Add second half stoppage time
                while (gameState.time < gameState.extraTime.secondExtra) {
                    simulateMinute();
                }
                
                addLogEntry("Extra time full time");
                gameState.matchEnded = true;
                updateMatchStatus();
                
                // Check aggregate score for two-leg ties
                if (gameState.isTwoLegs) {
                    const aggTeam1 = gameState.team1.score + gameState.leg1Score.team1;
                    const aggTeam2 = gameState.team2.score + gameState.leg1Score.team2;
                    
                    if (aggTeam1 !== aggTeam2) {
                        endMatch();
                    } else {
                        startPenaltyShootout();
                    }
                } 
                // For single matches, check current score
                else if (gameState.team1.score !== gameState.team2.score) {
                    endMatch();
                } else {
                    startPenaltyShootout();
                }
            } else {
                simulateLiveExtraTime();
            }
        }

        function simulateLiveExtraTime() {
            clearExistingIntervals();
            gameState.extraTime.secondHalf = 0;
            gameState.time = 90;
            gameState.isSimulating = true;

            gameState.simulationInterval = setInterval(() => {
                simulateMinute();
                
                if (gameState.time === 105) {
                    // First half of extra time ended, add stoppage time
                    clearInterval(gameState.simulationInterval);

                    gameState.simulationInterval = setInterval(() => {
                        simulateMinute();

                        if (gameState.time >= gameState.extraTime.firstExtra) {
                            clearInterval(gameState.simulationInterval);
                            addLogEntry("Extra time half time");
                            
                            // Reset time to 105 for the second half of extra time
                            gameState.time = 105;
                            gameState.extraTime.firstExtra = 0;

                            setTimeout(() => {
                                gameState.simulationInterval = setInterval(() => {
                                    simulateMinute();
                                    if (gameState.time >= 120) {
                                        clearInterval(gameState.simulationInterval);
                                        // Second half ended, add stoppage time
                                        gameState.simulationInterval = setInterval(() => {
                                            simulateMinute();
                                            if (gameState.time >= gameState.extraTime.secondExtra) {
                                                clearInterval(gameState.simulationInterval);
                                                addLogEntry("Extra time full time");
                                                gameState.matchEnded = true;
                                                updateMatchStatus();
                                                
                                                // Check aggregate score for two-leg ties
                                                if (gameState.isTwoLegs) {
                                                    const aggTeam1 = gameState.team1.score + gameState.leg1Score.team1;
                                                    const aggTeam2 = gameState.team2.score + gameState.leg1Score.team2;
                                                    
                                                    if (aggTeam1 !== aggTeam2) {
                                                        endMatch();
                                                    } else {
                                                        startPenaltyShootout();
                                                    }
                                                } 
                                                // For single matches, check current score
                                                else if (gameState.team1.score !== gameState.team2.score) {
                                                    endMatch();
                                                } else {
                                                    startPenaltyShootout();
                                                }
                                            }
                                        }, 750);
                                    }
                                }, 750);
                            }, 1500);
                        }
                    }, 750);
                }
            }, 750);
        }

        // Start penalty shootout
        function simulatePenaltyShootout() {
            const penaltyDatabase = ['✓', '✗', '✓']; // Tick, cross, tick
            
            let currentRound = 0;
            let currentTeam = 'home'; // Start with home team
            const takenPenalties = [];

            function processNextPenalty() {
                if (gameState.matchEnded) return;

                // Check if we should end BEFORE processing this penalty
                if (checkForWinnerBeforePenalty()) {
                    return;
                }

                const isTeam1 = currentTeam === 'home';
                const team = isTeam1 ? gameState.team1 : gameState.team2;
                const players = isTeam1 ? 
                    [...new Set([...gameState.team1.players].reverse())] : 
                    [...new Set([...gameState.team2.players].reverse())];
                
                const player = players[currentRound] || `${team.name} Player ${currentRound+1}`;
                const result = penaltyDatabase[Math.floor(Math.random() * penaltyDatabase.length)];

                // Record penalty
                takenPenalties.push({
                    round: currentRound + 1,
                    team: currentTeam,
                    player,
                    result
                });

                // Update score
                if (result === '✓') {
                    isTeam1 ? gameState.penalties.team1++ : gameState.penalties.team2++;
                }

                // Update UI only (no log entries)
                updatePenaltyDisplay();

                // Check for winner AFTER the penalty
                if (checkForWinnerAfterPenalty()) {
                    return;
                }

                // Switch teams and potentially advance round
                if (currentTeam === 'away') {
                    currentRound++;
                }
                currentTeam = currentTeam === 'home' ? 'away' : 'home';

                // Schedule next penalty
                if (!gameState.matchEnded) {
                    if (gameState.isLive) {
                        setTimeout(processNextPenalty, 1500);
                    } else {
                        processNextPenalty();
                    }
                }
            }

            function updatePenaltyDisplay() {
                elements.penaltyBody.innerHTML = '';
                
                // Group penalties by round
                const rounds = {};
                takenPenalties.forEach(pen => {
                    if (!rounds[pen.round]) {
                        rounds[pen.round] = { home: null, away: null };
                    }
                    rounds[pen.round][pen.team] = pen;
                });

                // Create table rows
                Object.keys(rounds).sort().forEach(roundNum => {
                    const round = rounds[roundNum];
                    const row = document.createElement('tr');
                    
                    row.innerHTML = `
                        <td>${roundNum}</td>
                        <td>${round.home ? `${round.home.result} (${round.home.player})` : ''}</td>
                        <td>${round.away ? `${round.away.result} (${round.away.player})` : ''}</td>
                    `;
                    
                    elements.penaltyBody.appendChild(row);
                });

                // Add totals row
                const totalRow = document.createElement('tr');
                totalRow.innerHTML = `
                    <td><strong>Total</strong></td>
                    <td><strong>${gameState.penalties.team1}</strong></td>
                    <td><strong>${gameState.penalties.team2}</strong></td>
                `;
                elements.penaltyBody.appendChild(totalRow);
            }

            function checkForWinnerBeforePenalty() {
                const totalRounds = 5;
                
                const homeTaken = takenPenalties.filter(p => p.team === 'home').length;
                const awayTaken = takenPenalties.filter(p => p.team === 'away').length;
                
                const homeRemaining = totalRounds - homeTaken;
                const awayRemaining = totalRounds - awayTaken;
                
                // Check if the team about to shoot cannot possibly catch up
                if (currentTeam === 'home') {
                    // Home is about to shoot - check if away can't catch up
                    if (gameState.penalties.team1 > gameState.penalties.team2 + awayRemaining) {
                        endPenaltyShootout();
                        return true;
                    }
                } else {
                    // Away is about to shoot - check if home can't catch up  
                    if (gameState.penalties.team2 > gameState.penalties.team1 + homeRemaining) {
                        endPenaltyShootout();
                        return true;
                    }
                }
                
                return false;
            }

            function checkForWinnerAfterPenalty() {
                const totalRounds = 5;
                
                const homeTaken = takenPenalties.filter(p => p.team === 'home').length;
                const awayTaken = takenPenalties.filter(p => p.team === 'away').length;
                
                const homeRemaining = totalRounds - homeTaken;
                const awayRemaining = totalRounds - awayTaken;
                
                // Check if the team that just shot made the other team mathematically out
                if (currentTeam === 'home') {
                    // Home just shot - check if away can't catch up
                    if (gameState.penalties.team1 > gameState.penalties.team2 + awayRemaining) {
                        endPenaltyShootout();
                        return true;
                    }
                } else {
                    // Away just shot - check if home can't catch up
                    if (gameState.penalties.team2 > gameState.penalties.team1 + homeRemaining) {
                        endPenaltyShootout();
                        return true;
                    }
                }
                
                // After all 5 rounds (each team has had 5 penalties), check if scores differ
                if (homeTaken >= totalRounds && awayTaken >= totalRounds && gameState.penalties.team1 !== gameState.penalties.team2) {
                    endPenaltyShootout();
                    return true;
                }
                
                return false;
            }

            function endPenaltyShootout() {
                gameState.matchEnded = true;
                endMatch();
            }

            // Start the penalty sequence
            processNextPenalty();
        }

        function adjustFinalStats() {
            // --- TEAM 1 ---
            const goals1 = gameState.team1.score;

            // Ensure shots on target >= goals
            gameState.stats.shotsOnTarget.team1 = Math.max(
                gameState.stats.shotsOnTarget.team1,
                goals1
            );

            // Ensure total shots >= shots on target
            gameState.stats.shots.team1 = Math.max(
                gameState.stats.shots.team1,
                gameState.stats.shotsOnTarget.team1
            );

            // --- TEAM 2 ---
            const goals2 = gameState.team2.score;

            // Ensure shots on target >= goals
            gameState.stats.shotsOnTarget.team2 = Math.max(
                gameState.stats.shotsOnTarget.team2,
                goals2
            );

            // Ensure total shots >= shots on target
            gameState.stats.shots.team2 = Math.max(
                gameState.stats.shots.team2,
                gameState.stats.shotsOnTarget.team2
            );
        }

                if (winner) {

            }
            
                if (!winner) {

            // Show leg 2 button if it's NOT a two-leg tie and we just played a single match
            const twoLegsCheckbox = document.getElementById('two-legs');

            gameState.time = 0;
            gameState.events = [];
            gameState.isExtraTime = false;
            gameState.isPenalties = false;
            gameState.penalties = { team1: 0, team2: 0, shots: [] };
            gameState.matchEnded = false;
            
            // RESET stats
            gameState.stats = {
                shots: { team1: 0, team2: 0 },
                shotsOnTarget: { team1: 0, team2: 0 },
                possession: { 
                    team1: Math.floor(Math.random() * 41) + 30, // Random between 30-70
                    get team2() {
                        return 100 - this.team1;
                    }
                 }
            };
            
            // Recalculate extra time
            calculateExtraTime();
            
            // Update UI
            elements.team1Score.textContent = "0";
            elements.team2Score.textContent = "0";
            elements.gameTime.textContent = "0'";
            elements.gameLog.innerHTML = "";
            elements.eventsBody.innerHTML = "";
            elements.penaltyShootout.classList.add('hidden');
            elements.statsContainer.classList.add('hidden');
            elements.leg2Button.classList.add('hidden');
            elements.extraTimeButton.classList.add('hidden');
            
            updateMatchStatus();
            
            // Add initial event
            addLogEntry(`Leg 1: ${gameState.team1.name} ${gameState.leg1Score.team1}-${gameState.leg1Score.team2} ${gameState.team2.name}`);
            addLogEntry("Leg 2 started!");
            updateAggregateDisplay();
            
            // Start simulation based on mode
            if (gameState.isImmediate) {
                simulateFullMatch();
            } else {
                simulateLive();
            }
        });
        
        document.getElementById('extra-time').addEventListener('click', function() {
            // Clear any existing interval
            if (gameState.simulationInterval) {
                clearInterval(gameState.simulationInterval);
            }
            
            // Reset time to 90 if we're not already in extra time
            if (!gameState.isExtraTime) {
                gameState.time = 90;
                elements.gameTime.textContent = "90'";
            }
            
            gameState.isExtraTime = true;
            gameState.matchEnded = false;
            elements.extraTimeButton.classList.add('hidden');
            addLogEntry("Extra time started!");

            elements.gameTime.classList.remove('hidden');
            elements.matchStatus.classList.add('hidden');
            
            // Check simulation mode
            if (gameState.isLive) {
                // Live simulation - use the interval-based approach
                simulateLiveExtraTime();
            } else {
                // Immediate result - simulate all at once
                startExtraTime();
            }
        });
    </script>
</body>
</html>
